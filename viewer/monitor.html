<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Live Monitor</title>
<style>
  :root { --bg:#0b0f16; --panel:#121925; --line:#243042; --text:#e2e8f0; --muted:#8a98ab; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui,"Malgun Gothic",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:15px; margin:0; }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; padding:12px 16px; }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0; }
  .card h2 { font-size:12px; color:var(--muted); margin:0 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  pre { margin:0; max-height:420px; overflow:auto; font:11px/1.4 ui-monospace,Consolas,monospace; color:#cbd5e1; white-space:pre-wrap; word-break:break-all; }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  .pill { padding:1px 8px; border-radius:999px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Sugar Hill Twin — 실시간 모니터</h1>
  <span id="conn" class="pill mono">연결 중…</span>
  <span class="mono" id="rate"></span>
  <span style="flex:1"></span>
  <span style="color:var(--muted);font-size:12px">이 화면은 트윈 화면(/v2)이 보내는 데이터를 WebSocket으로 받기만 합니다 (읽기 전용).</span>
  <a href="/" style="color:var(--accent)">허브</a>
</header>
<main>
  <section class="card">
    <h2>설비 상태</h2>
    <table><thead><tr><th>설비</th><th>상태</th><th>작업</th><th>진행</th><th>완료</th><th>가동률</th></tr></thead><tbody id="machines"></tbody></table>
    <h2 style="margin-top:12px">PLC 출력 · 아날로그</h2>
    <table><tbody id="plc"></tbody></table>
  </section>
  <section class="card">
    <h2>수신 원본 JSON (schema sugarhill-twin/1)</h2>
    <pre id="raw">아직 수신 없음 — /v2 화면을 열어 두세요.</pre>
  </section>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const COL = { IDLE:'#facc15', LOADING:'#38bdf8', RUNNING:'#22c55e', UNLOADING:'#38bdf8', HOLD:'#ef4444' };
  let count = 0, lastCount = 0;
  setInterval(() => { $('rate').textContent = `${count - lastCount} msg/s · 누적 ${count}`; lastCount = count; }, 1000);
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws?role=viewer`);
    ws.onopen = () => { $('conn').textContent = '연결됨'; $('conn').style.background = 'rgba(34,197,94,.2)'; };
    ws.onclose = () => { $('conn').textContent = '끊김 — 재시도'; $('conn').style.background = 'rgba(239,68,68,.2)'; setTimeout(connect, 2000); };
    ws.onmessage = ev => {
      count++;
      const m = JSON.parse(ev.data);
      if (m.type !== 'telemetry') return;
      $('machines').innerHTML = m.production.machines.map(x =>
        `<tr><td>${x.name}</td><td style="color:${COL[x.phase] || '#94a3b8'}">${x.phase}</td><td>${x.jobId ? '#' + x.jobId + ' ' + x.part : '–'}</td>` +
        `<td class="mono">${x.progress}%</td><td class="mono">${x.completed}</td><td class="mono">${x.utilization}%</td></tr>`).join('');
      if (m.plc) {
        const rows = Object.entries(m.plc.outputs).concat(Object.entries(m.plc.analogs));
        $('plc').innerHTML = rows.map(([k, v]) => `<tr><td class="mono">${k}</td><td class="mono">${v}</td></tr>`).join('');
      }
      $('raw').textContent = JSON.stringify(m, null, 2);
    };
  }
  connect();
})();
</script>
</body>
</html>
